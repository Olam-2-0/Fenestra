lex flex-col relative w-full pt-16 bg-surface min-h-screen pb-safe"><div class="flex flex-col w-full relative overflow-hidden bg-[#1C1A24] text-on-primary min-h-[calc(100vh-4rem)] px-gutter-mobile pb-space-lg select-none">
<!-- Ambient Atmospheric Glows -->
<div class="absolute -top-24 left-1/2 -translate-x-1/2 w-80 h-80 bg-tertiary-container/30 rounded-full blur-[100px] pointer-events-none animate-pulse" style="animation-duration: 7s;"></div>
<div class="absolute top-1/3 -left-20 w-64 h-64 bg-primary/25 rounded-full blur-[90px] pointer-events-none"></div>
<div class="absolute bottom-12 right-0 w-72 h-72 bg-tertiary-fixed-dim/15 rounded-full blur-[110px] pointer-events-none"></div>
<!-- 1. Top Minimal Bar -->
<div class="relative z-10 flex items-center justify-between pt-space-sm pb-space-md">
<!-- Minimal Close/Minimize -->
<button aria-label="Minimize focus session" class="w-9 h-9 rounded-full bg-surface-container-highest/20 backdrop-blur-md flex items-center justify-center text-on-primary/80 active:scale-90 transition-all hover:bg-surface-container-highest/30">
<span class="material-symbols-outlined text-[18px]">close</span>
</button>
<!-- Ambient Sound Pill Toggle -->
<button class="flex items-center gap-space-xs px-3 py-1.5 rounded-full bg-surface-container-highest/20 backdrop-blur-md active:scale-95 transition-all shadow-sm" id="soundToggleBtn">
<span class="material-symbols-outlined text-[16px] text-tertiary-fixed-dim animate-pulse">graphic_eq</span>
<span class="font-label-sm text-label-sm text-on-primary/90 tracking-wide font-medium">Rain on paper · 40%</span>
</button>
<!-- Focus Streak Badge -->
<div class="flex items-center gap-1 px-2.5 py-1 rounded-full bg-tertiary-container/40 text-on-tertiary-container backdrop-blur-sm">
<span class="material-symbols-outlined text-[15px] text-tertiary-fixed-dim" style="font-variation-settings: 'FILL' 1;">local_fire_department</span>
<span class="font-label-sm text-label-sm font-semibold tracking-wider">Day 4</span>
</div>
</div>
<!-- 2. Centerpiece Focus Sanctuary -->
<div class="relative z-10 flex-1 flex flex-col items-center justify-center text-center my-auto py-4">
<!-- Category Badge -->
<div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-surface-container-highest/15 text-primary-fixed-dim tracking-widest uppercase font-label-sm text-label-sm mb-3">
<span class="w-1.5 h-1.5 rounded-full bg-secondary-fixed animate-ping"></span>
      CAMPUSFLOW · DEEP SPRINT
    </div>
<!-- Active Task seraphic title -->
<h2 class="font-headline-lg text-headline-lg font-semibold text-white tracking-tight max-w-[280px] leading-tight mb-6">
      Complete project prototype
    </h2>
<!-- Visual Timer with Breathing Glowing Rings -->
<div class="relative w-64 h-64 flex items-center justify-center my-2">
<!-- Breathing Outer Soft Aura -->
<div class="absolute inset-0 rounded-full bg-gradient-to-tr from-primary/30 via-tertiary-container/20 to-primary-container/20 blur-xl animate-pulse" style="animation-duration: 4.5s;"></div>
<!-- SVG Progress & Ambient Halo -->
<svg class="w-full h-full -rotate-90 relative z-10" viewbox="0 0 240 240">
<!-- Background Track -->
<circle cx="120" cy="120" fill="none" r="102" stroke="#ffffff" stroke-opacity="0.08" stroke-width="3.5"></circle>
<!-- Soft Plum Secondary Track Glow -->
<circle cx="120" cy="120" fill="none" r="102" stroke="#6750a4" stroke-dasharray="640" stroke-dashoffset="180" stroke-linecap="round" stroke-opacity="0.35" stroke-width="7"></circle>
<!-- Progress Active Arc -->
<circle class="transition-all duration-1000 ease-linear shadow-[0_0_15px_#ecc156]" cx="120" cy="120" fill="none" id="timerProgress" r="102" stroke="#ecc156" stroke-dasharray="640" stroke-dashoffset="195" stroke-linecap="round" stroke-width="4.5"></circle>
</svg>
<!-- Center Countdown Numerals -->
<div class="absolute inset-0 flex flex-col items-center justify-center z-20">
<span class="font-display-lg text-display-lg font-semibold tracking-tighter text-white drop-shadow-sm select-none" id="timerDisplay">
          42:18
        </span>
<div class="flex items-center gap-1.5 mt-0.5 opacity-80">
<span class="w-1.5 h-1.5 rounded-full bg-secondary-fixed"></span>
<span class="font-label-sm text-label-sm text-primary-fixed-dim uppercase tracking-wider">Flowing</span>
</div>
</div>
</div>
<!-- Session metadata / rhythm -->
<div class="mt-4 flex items-center justify-center gap-2">
<div class="flex items-center gap-1.5 px-3 py-1 rounded-full bg-surface-container-highest/15 backdrop-blur-md">
<span class="material-symbols-outlined text-[15px] text-tertiary-fixed-dim">timelapse</span>
<span class="font-body-sm text-body-sm text-surface-container-highest">Sprint 2 of 3</span>
</div>
<span class="text-surface-dim">·</span>
<span class="font-body-sm text-body-sm text-surface-container-high/70">18 min break after</span>
</div>
</div>
<!-- 3. Controls Bar -->
<div class="relative z-10 flex flex-col items-center gap-space-sm mt-auto pt-2">
<!-- Quick-adjust micro nudges -->
<div class="flex items-center gap-space-sm mb-1">
<button class="px-3 py-1 rounded-full bg-surface-container-highest/15 hover:bg-surface-container-highest/25 active:scale-95 text-primary-fixed-dim font-label-md text-label-md transition-all backdrop-blur-sm" onclick="nudgeTime(5)">
        +5m
      </button>
<button class="px-3 py-1 rounded-full bg-surface-container-highest/15 hover:bg-surface-container-highest/25 active:scale-95 text-primary-fixed-dim font-label-md text-label-md transition-all backdrop-blur-sm" onclick="nudgeTime(10)">
        +10m
      </button>
</div>
<!-- Primary action capsule buttons -->
<div class="grid grid-cols-2 gap-space-sm w-full max-w-xs">
<!-- Pause (Frosted Glass Tactile Button) -->
<button class="flex items-center justify-center gap-2 py-3 px-4 rounded-full bg-surface-container-highest/20 hover:bg-surface-container-highest/30 active:scale-95 transition-all backdrop-blur-xl shadow-sm text-white" id="pausePlayBtn">
<span class="material-symbols-outlined text-[18px]" id="pausePlayIcon">pause</span>
<span class="font-label-lg text-label-lg font-semibold tracking-wide" id="pausePlayLabel">Pause</span>
</button>
<!-- Finish Session (Deep Plum Capsule) -->
<button class="flex items-center justify-center gap-2 py-3 px-4 rounded-full bg-primary hover:bg-primary-container active:scale-95 transition-all text-on-primary shadow-[0_0_20px_rgba(103,80,164,0.45)]" id="finishBtn">
<span class="material-symbols-outlined text-[18px]">check</span>
<span class="font-label-lg text-label-lg font-semibold tracking-wide">Finish</span>
</button>
</div>
</div>
<!-- 4. Bottom Sanctuary Note & Shield -->
<div class="relative z-10 mt-6 flex flex-col items-center text-center gap-2">
<!-- Seraphic Mindful Affirmation -->
<p class="font-body-md text-body-md italic tracking-wide text-surface-container-highest/80 font-serif">
      “Everything else can wait.”
    </p>
<!-- Floating Shield Indicator -->
<div class="flex items-center gap-1.5 px-3.5 py-1.5 rounded-full bg-surface-container-highest/10 backdrop-blur-md">
<span class="material-symbols-outlined text-[14px] text-secondary-fixed">do_not_disturb_on</span>
<span class="font-label-sm text-label-sm text-on-primary/70">Do Not Disturb active · 4 silenced</span>
</div>
</div>
</div>
<script>
  let secondsRemaining = 42 * 60 + 18;
  let isRunning = true;
  let timerInterval = null;
  const initialSeconds = 50 * 60; // Total planned sprint length for arc gauge

  const timerDisplay = document.getElementById('timerDisplay');
  const timerProgress = document.getElementById('timerProgress');
  const pausePlayBtn = document.getElementById('pausePlayBtn');
  const pausePlayIcon = document.getElementById('pausePlayIcon');
  const pausePlayLabel = document.getElementById('pausePlayLabel');
  const soundToggleBtn = document.getElementById('soundToggleBtn');

  function updateTimerUI() {
    const mins = Math.floor(secondsRemaining / 60);
    const secs = secondsRemaining % 60;
    timerDisplay.textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;

    // SVG arc stroke total perimeter ~ 640
    const fractionRemaining = secondsRemaining / initialSeconds;
    const offset = 640 - (fractionRemaining * 440);
    timerProgress.setAttribute('stroke-dashoffset', Math.max(0, Math.min(640, offset)));
  }

  function startTimer() {
    if (timerInterval) clearInterval(timerInterval);
    timerInterval = setInterval(() => {
      if (secondsRemaining > 0) {
        secondsRemaining--;
        updateTimerUI();
      } else {
        clearInterval(timerInterval);
        isRunning = false;
        pausePlayIcon.textContent = 'play_arrow';
        pausePlayLabel.textContent = 'Restart';
      }
    }, 1000);
  }

  function togglePlayPause() {
    if (isRunning) {
      clearInterval(timerInterval);
      isRunning = false;
      pausePlayIcon.textContent = 'play_arrow';
      pausePlayLabel.textContent = 'Resume';
    } else {
      if (secondsRemaining <= 0) secondsRemaining = initialSeconds;
      isRunning = true;
      pausePlayIcon.textContent = 'pause';
      pausePlayLabel.textContent = 'Pause';
      startTimer();
    }
  }

  function nudgeTime(minutes) {
    secondsRemaining += minutes * 60;
    updateTimerUI();
    // Micro tactile pulse
    timerDisplay.classList.add('scale-105');
    setTimeout(() => timerDisplay.classList.remove('scale-105'), 200);
  }

  pausePlayBtn.addEventListener('click', togglePlayPause);

  // Micro toggle for ambient audio
  let soundActive = true;
  soundToggleBtn.addEventListener('click', () => {
    soundActive = !soundActive;
    soundToggleBtn.classList.toggle('opacity-50', !soundActive);
  });

  startTimer();
</script></main></body></html>
